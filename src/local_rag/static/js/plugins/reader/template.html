<div class="reader-empty empty-state" data-ref="empty">
  <i class="ti ti-file-text" aria-hidden="true"></i>
  <span class="empty-title">select a document</span>
  <span class="empty-sub">click any file in the sidebar to read</span>
</div>
<div class="reader-content" data-ref="content" style="display:none">
  <div class="reader-header">
    <div class="reader-title-block">
      <div class="reader-title" data-ref="title"></div>
      <div class="reader-tag-row" data-ref="tagRow"></div>
    </div>
    <div class="reader-actions">
      <button class="btn-icon" data-ref="editTags" title="edit tags"><i class="ti ti-tag"></i></button>
      <button class="btn-icon" data-ref="copy" title="copy"><i class="ti ti-copy"></i></button>
      <a class="btn-icon" data-ref="download" download title="download"><i class="ti ti-download"></i></a>
      <button class="btn-icon" data-ref="del" title="delete"><i class="ti ti-trash"></i></button>
      <button class="btn-icon" data-ref="close" title="close"><i class="ti ti-x"></i></button>
    </div>
  </div>
  <div class="reader-media" data-ref="media"></div>
  <div class="reader-body" data-ref="body"></div>
</div>
