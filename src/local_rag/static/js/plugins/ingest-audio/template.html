<div class="ingest-form">
  <div class="dropzone" data-ref="dropzone">
    <i class="ti ti-microphone" aria-hidden="true"></i>
    <span data-ref="dropLabel">drop audio or click to choose</span>
    <input type="file" accept=".mp3,.wav,.m4a,.ogg" data-ref="file" hidden />
  </div>
  <label class="ingest-label">tags</label>
  <div data-ref="tagsMount"></div>
  <button class="btn-done ingest-submit" data-ref="submit">ingest audio</button>

  <div class="audio-overlay" data-ref="overlay" hidden>
    <div class="audio-spinner" aria-hidden="true"></div>
    <div class="audio-overlay-text">
      Transcribing…
      <span class="audio-overlay-sub">this can take several minutes</span>
    </div>
  </div>
</div>
