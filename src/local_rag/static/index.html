<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Search</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--mono:'DM Mono',monospace;--serif:'Instrument Serif',serif;--sans:'DM Sans',sans-serif;
--color-bg-primary:#ffffff;--color-bg-secondary:#fafafa;--color-bg-info:#f0f7ff;
--color-border-primary:#000;--color-border-secondary:#d1d1d1;--color-border-tertiary:#eaeaea;
--color-text-primary:#111;--color-text-secondary:#555;--color-text-tertiary:#888;--color-text-info:#0055bb;
--radius-md:6px;--radius-lg:12px;}

/* Scrollbar tweaks */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--color-border-secondary); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--color-text-tertiary); }

body { background: #f4f4f5; padding: 2rem; display: flex; justify-content: center; align-items: center; min-height: 100vh;}
.shell{width: 100%; max-width: 1200px; background:var(--color-bg-primary); display:grid;grid-template-columns:300px 1fr;height:80vh;min-height:640px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--radius-lg);overflow:hidden;font-family:var(--sans); box-shadow: 0 4px 24px rgba(0,0,0,0.04);}
.sidebar{background:var(--color-bg-secondary);border-right:0.5px solid var(--color-border-tertiary);display:flex;flex-direction:column;overflow:hidden}
.sidebar-header{padding:1.25rem 1rem 0.75rem;border-bottom:0.5px solid var(--color-border-tertiary);flex-shrink:0}
.logo{display:flex;align-items:center;gap:8px;margin-bottom:1rem}
.logo-mark{width:28px;height:28px;background:var(--color-text-primary);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-mark i{font-size:15px;color:var(--color-bg-primary)}
.logo-text{font-family:var(--serif);font-size:17px;color:var(--color-text-primary)}
.search-box{position:relative;margin-bottom:0.75rem}
.search-box input{width:100%;padding:8px 12px 8px 34px;font-size:13px;font-family:var(--sans);background:var(--color-bg-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--radius-md);color:var(--color-text-primary);outline:none; transition: border-color 0.2s;}
.search-box input:focus{border-color:var(--color-border-primary)}
.search-box .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--color-text-tertiary);pointer-events:none}
.mode-toggle{display:flex;gap:4px}
.mode-btn{flex:1;padding:5px 4px;font-size:11px;font-family:var(--mono);border:0.5px solid var(--color-border-tertiary);border-radius:var(--radius-md);background:transparent;color:var(--color-text-secondary);cursor:pointer;transition:all 0.15s}
.mode-btn.active{background:var(--color-text-primary);color:var(--color-bg-primary);border-color:var(--color-text-primary)}
.tag-filter-rail{padding:0.5rem 0.75rem;border-bottom:0.5px solid var(--color-border-tertiary);flex-shrink:0}
.rail-label{font-size:10px;font-family:var(--mono);color:var(--color-text-tertiary);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px}
.tag-chips{display:flex;flex-wrap:wrap;gap:4px}
.tag-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:11px;font-family:var(--mono);cursor:pointer;border:0.5px solid transparent;transition:all 0.15s;user-select:none}
.tag-chip.inactive{background:var(--color-bg-primary);border-color:var(--color-border-tertiary);color:var(--color-text-secondary)}
.tag-chip.inactive:hover{border-color:var(--color-border-secondary);color:var(--color-text-primary)}
.doc-list{flex:1;overflow-y:auto;padding:0.5rem}
.doc-section-label{font-size:10px;font-family:var(--mono);color:var(--color-text-tertiary);letter-spacing:0.08em;text-transform:uppercase;padding:0.75rem 0.5rem 0.4rem}
.doc-item{display:flex;align-items:flex-start;gap:8px;padding:8px;border-radius:var(--radius-md);cursor:pointer;border:0.5px solid transparent;transition:background 0.1s;position:relative}
.doc-item:hover{background:var(--color-bg-primary)}
.doc-item.active{background:var(--color-bg-primary);border-color:var(--color-border-tertiary)}
.doc-icon{width:28px;height:28px;border-radius:6px;background:var(--color-bg-info);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.doc-icon i{font-size:14px;color:var(--color-text-info)}
.doc-meta{flex:1;min-width:0}
.doc-name{font-size:12px;font-weight:500;color:var(--color-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.doc-date{font-size:10px;font-family:var(--mono);color:var(--color-text-tertiary);margin-bottom:4px}
.doc-tags{display:flex;flex-wrap:wrap;gap:3px}
.doc-tag{display:inline-flex;align-items:center;gap:2px;padding:1px 6px;border-radius:20px;font-size:10px;font-family:var(--mono)}
.doc-tag-btn{opacity:0;position:absolute;right:6px;top:6px;width:20px;height:20px;border:0.5px solid var(--color-border-tertiary);border-radius:4px;background:var(--color-bg-primary);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity 0.15s}
.doc-item:hover .doc-tag-btn{opacity:1}
.upload-zone{margin:0.5rem;border:1px dashed var(--color-border-secondary);border-radius:var(--radius-md);padding:0.75rem;text-align:center;cursor:pointer;transition:all 0.15s;background:var(--color-bg-primary);flex-shrink:0}
.upload-zone:hover{border-color:var(--color-border-primary)}
.upload-zone i{font-size:18px;color:var(--color-text-secondary);display:block;margin-bottom:4px}
.upload-zone span{font-size:11px;color:var(--color-text-secondary)}
.uploading { opacity: 0.6; pointer-events: none; }
.uploading i { animation: spin 1s linear infinite; }
@keyframes spin { 100% { transform: rotate(360deg); } }

.main{display:flex;flex-direction:column;background:var(--color-bg-primary);overflow:hidden; position: relative;}
.panel-tabs{display:flex;gap:0;border-bottom:0.5px solid var(--color-border-tertiary);flex-shrink:0}
.panel-tab{padding:0.65rem 1.25rem;font-size:12px;font-family:var(--mono);color:var(--color-text-secondary);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.15s}
.panel-tab.active{color:var(--color-text-primary);border-bottom-color:var(--color-text-primary)}
.panel-tab:hover:not(.active){color:var(--color-text-primary)}
.main-toolbar{padding:0.75rem 1.25rem;border-bottom:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;gap:8px;flex-shrink:0}
.query-input{flex:1;padding:8px 12px;font-size:14px;font-family:var(--sans);background:var(--color-bg-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--radius-md);color:var(--color-text-primary);outline:none; transition: background 0.2s, border 0.2s;}
.query-input:focus{border-color:var(--color-border-primary);background:var(--color-bg-primary)}
.btn-search{padding:7px 14px;font-size:12px;font-family:var(--mono);background:var(--color-text-primary);color:var(--color-bg-primary);border:none;border-radius:var(--radius-md);cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;flex-shrink:0; transition: transform 0.1s;}
.btn-search:active{transform: scale(0.97);}
.limit-select{font-size:12px;font-family:var(--mono);padding:7px 8px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--radius-md);background:var(--color-bg-secondary);color:var(--color-text-secondary);outline:none;flex-shrink:0}
.active-tag-filters{padding:6px 1.25rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap;border-bottom:0.5px solid var(--color-border-tertiary);flex-shrink:0}
.active-tag-filters.hidden{display:none}
.filter-label{font-size:11px;font-family:var(--mono);color:var(--color-text-tertiary)}
.active-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:20px;font-size:11px;font-family:var(--mono);cursor:pointer}
.results-area{flex:1;overflow-y:auto;padding:1rem 1.25rem}
.results-meta{font-size:11px;font-family:var(--mono);color:var(--color-text-tertiary);margin-bottom:0.75rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:3px;font-size:10px;font-family:var(--mono)}
.badge-hybrid{background:var(--color-bg-info);color:var(--color-text-info)}
.result-card{border:0.5px solid var(--color-border-tertiary);border-radius:var(--radius-lg);padding:1rem 1.25rem;margin-bottom:0.75rem;transition:border-color 0.15s;cursor:pointer}
.result-card:hover{border-color:var(--color-border-primary)}
.result-header{display:flex;align-items:flex-start;justify-content:space-between;gap:0.75rem;margin-bottom:0.5rem}
.result-source{font-size:11px;font-family:var(--mono);color:var(--color-text-tertiary);display:flex;align-items:center;gap:4px}
.result-rank{font-size:10px;font-family:var(--mono);color:var(--color-text-tertiary);background:var(--color-bg-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:3px;padding:1px 6px;}
.score-bar{display:flex;align-items:center;gap:6px;margin-bottom:0.6rem}
.score-track{flex:1;height:3px;background:var(--color-border-tertiary);border-radius:2px;overflow:hidden}
.score-fill{height:100%;background:var(--color-text-primary);border-radius:2px}
.score-val{font-size:10px;font-family:var(--mono);color:var(--color-text-tertiary);min-width:32px;text-align:right}
.result-text{font-size:13px;line-height:1.65;color:var(--color-text-primary)}
.result-text.clamped{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.result-footer{display:flex;align-items:center;justify-content:space-between;margin-top:0.6rem}
.result-tags{display:flex;gap:3px;flex-wrap:wrap}
.chunk-idx{font-size:10px;font-family:var(--mono);color:var(--color-text-tertiary)}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:280px;gap:0.75rem;padding:2rem;text-align:center}
.empty-state i{font-size:32px;color:var(--color-text-tertiary)}
.empty-title{font-family:var(--serif);font-size:18px;font-style:italic;color:var(--color-text-secondary)}
.empty-sub{font-size:12px;font-family:var(--mono);color:var(--color-text-tertiary)}
.highlight{background:rgba(255,220,80,0.3);border-radius:2px;padding:0 2px}

.reader-header{padding:1rem 1.25rem;border-bottom:0.5px solid var(--color-border-tertiary);display:flex;align-items:flex-start;justify-content:space-between;flex-shrink:0}
.reader-title-block{flex:1;min-width:0}
.reader-title{font-family:var(--serif);font-size:16px;color:var(--color-text-primary);margin-bottom:6px}
.reader-tag-row{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.reader-tag-add{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px;font-size:11px;font-family:var(--mono);border:0.5px dashed var(--color-border-secondary);color:var(--color-text-tertiary);cursor:pointer;transition:all 0.15s}
.reader-tag-add:hover{border-color:var(--color-border-primary);color:var(--color-text-secondary)}
.reader-actions{display:flex;gap:6px;flex-shrink:0;margin-left:8px}
.btn-icon{width:30px;height:30px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--radius-md);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--color-text-secondary);transition:background 0.1s}
.btn-icon:hover{background:var(--color-bg-secondary)}
.reader-body{flex:1;overflow-y:auto;padding:1.5rem;font-size:14px;line-height:1.8;color:var(--color-text-primary)}
.reader-body h1,.reader-body h2,.reader-body h3{font-family:var(--serif);margin:1.5rem 0 0.5rem;line-height:1.3}
.reader-body p{margin-bottom:1rem}
.reader-body table{width:100%;border-collapse:collapse;font-size:13px;margin:1rem 0}
.reader-body th{border:0.5px solid var(--color-border-tertiary);padding:6px 10px;background:var(--color-bg-secondary);text-align:left;font-weight:500}
.reader-body td{border:0.5px solid var(--color-border-tertiary);padding:6px 10px}
.reader-body code{font-family:var(--mono);font-size:12px;background:var(--color-bg-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:3px;padding:1px 5px}

.modal-backdrop{position: absolute; top:0;left:0;right:0;bottom:0; background:rgba(0,0,0,0.2); backdrop-filter: blur(4px); display:flex;align-items:center;justify-content:center; z-index: 100;}
.modal{background:var(--color-bg-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--radius-lg);padding:1.25rem;width:280px; box-shadow: 0 10px 40px rgba(0,0,0,0.1);}
.modal-title{font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:1rem}
.modal-doc-name{font-size:12px;font-family:var(--mono);color:var(--color-text-secondary);margin-bottom:0.75rem;padding:6px 8px;background:var(--color-bg-secondary);border-radius:var(--radius-md)}
.tag-grid{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:1rem}
.tag-toggle{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;font-family:var(--mono);cursor:pointer;border:0.5px solid transparent;transition:all 0.15s}
.tag-toggle.off{background:var(--color-bg-secondary);border-color:var(--color-border-tertiary);color:var(--color-text-secondary)}
.tag-toggle.off:hover{border-color:var(--color-border-secondary);color:var(--color-text-primary)}
.tag-toggle.on{border-color:transparent}
.new-tag-row{display:flex;gap:6px;margin-bottom:1rem}
.new-tag-row input{flex:1;padding:6px 10px;font-size:12px;font-family:var(--mono);background:var(--color-bg-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--radius-md);color:var(--color-text-primary);outline:none}
.new-tag-row input:focus{border-color:var(--color-border-primary)}
.btn-add-tag{padding:6px 10px;font-size:11px;font-family:var(--mono);background:var(--color-text-primary);color:var(--color-bg-primary);border:none;border-radius:var(--radius-md);cursor:pointer}
.modal-actions{display:flex;justify-content:flex-end;gap:6px; margin-top: 1rem; border-top: 0.5px solid var(--color-border-tertiary); padding-top: 1rem;}
.btn-cancel{padding:6px 12px;font-size:12px;font-family:var(--mono);border:0.5px solid var(--color-border-tertiary);border-radius:var(--radius-md);background:transparent;color:var(--color-text-secondary);cursor:pointer}
.btn-done{padding:6px 12px;font-size:12px;font-family:var(--mono);background:var(--color-text-primary);color:var(--color-bg-primary);border:none;border-radius:var(--radius-md);cursor:pointer}
.status-dot{width:7px;height:7px;border-radius:50%;background:#3a9e6e;display:inline-block;margin-right:5px}
</style>
</head>
<body>

<div class="shell">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-mark"><i class="ti ti-database" aria-hidden="true"></i></div>
        <span class="logo-text">knowledge</span>
      </div>
      <div class="search-box">
        <i class="ti ti-search si" aria-hidden="true"></i>
        <input type="text" placeholder="filter documents…" id="doc-filter" aria-label="filter document list">
      </div>
      <div class="mode-toggle">
        <button class="mode-btn active" onclick="setMode('hybrid')" id="mode-hybrid">hybrid</button>
        <button class="mode-btn" onclick="setMode('dense')" id="mode-dense">dense</button>
        <button class="mode-btn" onclick="setMode('sparse')" id="mode-sparse">sparse</button>
      </div>
    </div>

    <div class="tag-filter-rail" id="tag-filter-rail">
      <div class="rail-label">filter by tag</div>
      <div class="tag-chips" id="tag-filter-chips"></div>
    </div>

    <div class="doc-list" id="doc-list">
      <div class="doc-section-label" id="doc-section-label">indexed documents</div>
      <div id="docs-container"></div>
    </div>

    <div class="upload-zone" onclick="triggerUpload()" id="upload-zone">
      <i class="ti ti-upload" id="upload-icon"></i>
      <span id="upload-label">drop PDF or click to upload</span>
      <input type="file" id="file-input" accept=".pdf" style="display:none" onchange="handleUpload(event)">
    </div>
  </div>

  <div class="main">
    <div class="panel-tabs">
      <div class="panel-tab active" onclick="switchPanel('search')" id="tab-search">search</div>
      <div class="panel-tab" onclick="switchPanel('reader')" id="tab-reader">reader</div>
    </div>

    <div id="panel-search" style="display:flex;flex-direction:column;flex:1;overflow:hidden">
      <div class="main-toolbar">
        <input class="query-input" type="text" id="query-input" placeholder="ask anything about your documents…" aria-label="search query">
        <button class="btn-search" onclick="runSearch()">
          <i class="ti ti-arrow-right" aria-hidden="true"></i> search
        </button>
        <select class="limit-select" id="limit-sel">
          <option value="3">top 3</option>
          <option value="5" selected>top 5</option>
          <option value="10">top 10</option>
        </select>
      </div>
      <div class="active-tag-filters hidden" id="active-tag-filters"></div>
      <div class="results-area" id="results-area">
        <div class="empty-state">
          <i class="ti ti-books"></i>
          <span class="empty-title">ready to search</span>
          <span class="empty-sub">run a query to pull chunks</span>
        </div>
      </div>
    </div>

    <div id="panel-reader" style="display:none;flex-direction:column;flex:1;overflow:hidden">
      <div id="reader-empty" class="empty-state">
        <i class="ti ti-file-text"></i>
        <span class="empty-title">select a document</span>
        <span class="empty-sub">click any file in the sidebar to read</span>
      </div>
      <div id="reader-content" style="display:none;flex-direction:column;flex:1;overflow:hidden">
        <div class="reader-header">
          <div class="reader-title-block">
            <div class="reader-title" id="reader-filename"></div>
            <div class="reader-tag-row" id="reader-tag-row"></div>
          </div>
          <div class="reader-actions">
            <button class="btn-icon" onclick="openTagModal(currentDoc)" title="edit tags"><i class="ti ti-tag"></i></button>
            <button class="btn-icon" onclick="copyText()" title="copy"><i class="ti ti-copy"></i></button>
            <button class="btn-icon" onclick="closeReader()" title="close"><i class="ti ti-x"></i></button>
          </div>
        </div>
        <div class="reader-body" id="reader-body"></div>
      </div>
    </div>

    <div id="panel-modal" style="display:none;">
      <div class="modal-backdrop">
        <div class="modal">
          <div class="modal-title">edit tags</div>
          <div class="modal-doc-name" id="modal-doc-name"></div>
          <div class="tag-grid" id="modal-tag-grid"></div>
          <div class="new-tag-row">
            <input type="text" id="new-tag-input" placeholder="new tag name…" maxlength="24" onkeydown="if(event.key==='Enter')addNewTag()">
            <button class="btn-add-tag" onclick="addNewTag()">+ add</button>
          </div>
          <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">cancel</button>
            <button class="btn-done" onclick="saveModal()">save</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// Deterministic color mapping for tags
const TAG_COLORS = [
  {bg:'#E6F1FB',border:'#185FA5',text:'#0C447C'},
  {bg:'#E1F5EE',border:'#0F6E56',text:'#085041'},
  {bg:'#FAEEDA',border:'#854F0B',text:'#633806'},
  {bg:'#EEEDFE',border:'#534AB7',text:'#3C3489'},
  {bg:'#FBEAF0',border:'#993556',text:'#72243E'}
];

const API_BASE = '/api';
let allDocuments = [];
let globalTags = new Set();
let activeTags = new Set();
let mode = 'hybrid';
let currentDoc = null;
let modalDoc = null;
let modalSelected = new Set();

// Utility: Hash string to pick a consistent color
function getColorForTag(tag) {
  let hash = 0;
  for (let i = 0; i < tag.length; i++) hash = tag.charCodeAt(i) + ((hash << 5) - hash);
  return TAG_COLORS[Math.abs(hash) % TAG_COLORS.length];
}

// Fetch live document list from backend
async function fetchDocuments() {
  try {
    const res = await fetch(`${API_BASE}/documents`);
    allDocuments = await res.json();

    // Extract unique tags globally
    globalTags.clear();
    allDocuments.forEach(doc => doc.tags.forEach(t => globalTags.add(t)));

    // Cleanup active filters if tags were deleted globally
    activeTags.forEach(t => { if(!globalTags.has(t)) activeTags.delete(t); });

    renderTagFilterRail();
    renderDocs(document.getElementById('doc-filter').value);
  } catch(e) {
    console.error("Failed to fetch documents", e);
  }
}

function tagPillHTML(tag, isInteractive=false){
  const c = getColorForTag(tag);
  return `<span class="doc-tag" style="background:${c.bg};border:0.5px solid ${c.border};color:${c.text}; ${isInteractive?'padding:3px 8px;font-size:11px':''}">${tag}</span>`;
}

function renderTagFilterRail(){
  const container = document.getElementById('tag-filter-chips');
  container.innerHTML = Array.from(globalTags).map(tag => {
    const c = getColorForTag(tag);
    const isActive = activeTags.has(tag);
    if(isActive){
      return `<span class="tag-chip" style="background:${c.bg};border-color:${c.border};color:${c.text}" onclick="toggleTagFilter('${tag}')">${tag}</span>`;
    }
    return `<span class="tag-chip inactive" onclick="toggleTagFilter('${tag}')">${tag}</span>`;
  }).join('');
}

function toggleTagFilter(tag){
  if(activeTags.has(tag)) activeTags.delete(tag);
  else activeTags.add(tag);
  renderTagFilterRail();
  renderActiveBadges();
  renderDocs(document.getElementById('doc-filter').value);
}

function renderActiveBadges(){
  const bar = document.getElementById('active-tag-filters');
  if(activeTags.size === 0){ bar.classList.add('hidden'); return; }

  bar.classList.remove('hidden');
  bar.innerHTML = '<span class="filter-label">filtering:</span>';

  activeTags.forEach(tag => {
    const c = getColorForTag(tag);
    const chip = document.createElement('span');
    chip.className = 'active-chip';
    chip.style.cssText = `background:${c.bg};border:0.5px solid ${c.border};color:${c.text}`;
    chip.innerHTML = `${tag}<i class="ti ti-x"></i>`;
    chip.onclick = () => toggleTagFilter(tag);
    bar.appendChild(chip);
  });

  const clear = document.createElement('span');
  clear.style.cssText = 'font-size:11px;font-family:var(--mono);color:var(--color-text-tertiary);cursor:pointer;margin-left:auto';
  clear.textContent = 'clear filters';
  clear.onclick = () => { activeTags.clear(); renderTagFilterRail(); renderActiveBadges(); renderDocs(); };
  bar.appendChild(clear);
}

function renderDocs(filter=''){
  const container = document.getElementById('docs-container');
  const label = document.getElementById('doc-section-label');

  let visible = allDocuments.filter(d => {
    if(!d.name.toLowerCase().includes(filter.toLowerCase())) return false;
    if(activeTags.size === 0) return true;
    return Array.from(activeTags).every(t => d.tags.includes(t));
  });

  label.textContent = visible.length === allDocuments.length ? 'all documents' : `filtered (${visible.length})`;

  if(!visible.length){
    container.innerHTML = `<div style="padding:1rem;text-align:center;font-size:12px;color:var(--color-text-tertiary);font-family:var(--mono)">no matching docs</div>`;
    return;
  }

  container.innerHTML = visible.map(d => `
    <div class="doc-item ${currentDoc === d.name ? 'active' : ''}" onclick="openDoc('${d.name}')">
      <div class="doc-icon"><i class="ti ti-file-text"></i></div>
      <div class="doc-meta">
        <div class="doc-name">${d.name}</div>
        <div class="doc-date">${d.chunks} chunks</div>
        <div class="doc-tags">${d.tags.map(t => tagPillHTML(t)).join('')}</div>
      </div>
      <button class="doc-tag-btn" onclick="event.stopPropagation();openTagModal('${d.name}')"><i class="ti ti-tag"></i></button>
    </div>
  `).join('');
}

async function openDoc(name){
  currentDoc = name;
  renderDocs(document.getElementById('doc-filter').value);
  const body = document.getElementById('reader-body');
  body.innerHTML = 'loading...';

  document.getElementById('reader-filename').textContent = name;
  document.getElementById('reader-empty').style.display = 'none';
  document.getElementById('reader-content').style.display = 'flex';
  switchPanel('reader');

  try {
    const res = await fetch(`${API_BASE}/document/${name}`);
    if(res.ok){
      const data = await res.json();
      body.innerHTML = renderMarkdown(data.content);
    } else {
      body.innerHTML = '<i>Document markdown not found on disk.</i>';
    }
  } catch(e) {
    body.innerHTML = '<i>Error fetching document.</i>';
  }

  const docObj = allDocuments.find(d => d.name === name);
  const row = document.getElementById('reader-tag-row');
  row.innerHTML = (docObj?.tags || []).map(t => tagPillHTML(t, true)).join('') +
                  `<span class="reader-tag-add" onclick="openTagModal('${name}')"><i class="ti ti-plus"></i> tag</span>`;
}

function closeReader(){
  currentDoc = null;
  document.getElementById('reader-empty').style.display = 'flex';
  document.getElementById('reader-content').style.display = 'none';
  renderDocs(document.getElementById('doc-filter').value);
}

// Modal Logic
function openTagModal(docName){
  modalDoc = docName;
  const docObj = allDocuments.find(d => d.name === docName);
  modalSelected = new Set(docObj?.tags || []);

  document.getElementById('modal-doc-name').textContent = docName;
  renderModalTagGrid();
  switchPanel('modal');
}

function renderModalTagGrid(){
  const grid = document.getElementById('modal-tag-grid');
  // Combine global tags and this document's tags
  const modalVisibleTags = new Set([...globalTags, ...modalSelected]);

  grid.innerHTML = Array.from(modalVisibleTags).map(tag => {
    const on = modalSelected.has(tag);
    const c = getColorForTag(tag);
    const style = on ? `background:${c.bg};border-color:${c.border};color:${c.text}` : '';
    return `<span class="tag-toggle ${on?'on':'off'}" style="${style}" onclick="toggleModalTag('${tag}')">${tag}</span>`;
  }).join('');
}

function toggleModalTag(tag){
  if(modalSelected.has(tag)) modalSelected.delete(tag);
  else modalSelected.add(tag);
  renderModalTagGrid();
}

function addNewTag(){
  const input = document.getElementById('new-tag-input');
  const val = input.value.trim().toLowerCase();
  if(!val) return;
  modalSelected.add(val);
  input.value = '';
  renderModalTagGrid();
}

async function saveModal(){
  const tagsArr = Array.from(modalSelected);

  try {
    await fetch(`${API_BASE}/tags/${modalDoc}`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ tags: tagsArr })
    });
    await fetchDocuments(); // Refresh whole state
  } catch(e) {
    console.error(e);
  }

  if(currentDoc === modalDoc) openDoc(modalDoc);
  switchPanel(currentDoc ? 'reader' : 'search');
}

function closeModal(){
  switchPanel(currentDoc ? 'reader' : 'search');
}

function setMode(m){
  mode = m;
  ['hybrid','dense','sparse'].forEach(x => {
    document.getElementById('mode-'+x).classList.toggle('active', x === m);
  });
}

function switchPanel(p){
  ['search','reader','modal'].forEach(x => {
    const el = document.getElementById('panel-'+x);
    if(el) el.style.display = x === p ? (p==='modal'?'block':'flex') : 'none';
    const tab = document.getElementById('tab-'+x);
    if(tab) tab.classList.toggle('active', x === p);
  });
}

// Search Logic
async function runSearch(){
  const q = document.getElementById('query-input').value.trim();
  const limit = parseInt(document.getElementById('limit-sel').value);
  if(!q) return;

  const area = document.getElementById('results-area');
  area.innerHTML = `<div class="empty-state"><i class="ti ti-loader" style="animation: spin 1s linear infinite;"></i><span class="empty-title">searching knowledge base...</span></div>`;

  try {
    const start = performance.now();
    const res = await fetch(`${API_BASE}/search`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ query: q, limit: limit, tags: Array.from(activeTags), mode: mode })
    });
    const results = await res.json();
    const ms = Math.round(performance.now() - start);

    if(!results.length){
      area.innerHTML = `<div class="empty-state"><i class="ti ti-zoom-cancel"></i><span class="empty-title">no results found</span><span class="empty-sub">try broadening your query</span></div>`;
      return;
    }

    area.innerHTML = `<div class="results-meta"><span class="status-dot"></span>${results.length} results <span class="badge badge-hybrid">${mode}</span> · <span style="color:var(--color-text-tertiary)">${ms}ms</span></div>`;

    results.forEach((r, i) => {
      const card = document.createElement('div');
      card.className = 'result-card';
      const highlighted = highlightQuery(r.text, q);
      card.innerHTML = `
        <div class="result-header">
          <span class="result-source"><i class="ti ti-file-text" style="font-size:13px"></i>${r.source}</span>
          <span class="result-rank">#${i+1}</span>
        </div>
        <div class="score-bar">
          <div class="score-track"><div class="score-fill" style="width:${Math.round(r.score*100)}%"></div></div>
          <span class="score-val">${r.score.toFixed(3)}</span>
        </div>
        <div class="result-text clamped" id="rt-${i}">${highlighted}</div>
        <div class="result-footer">
          <div class="result-tags">${r.tags.map(t => tagPillHTML(t)).join('')}</div>
          <span class="chunk-idx">chunk ${r.chunk_index}</span>
        </div>
      `;
      card.onclick = () => card.querySelector(`#rt-${i}`).classList.toggle('clamped');
      area.appendChild(card);
    });
  } catch(e) {
    area.innerHTML = `<div class="empty-state"><span class="empty-title">Search Error</span></div>`;
  }
}

function highlightQuery(text, query){
  if(!query) return text;
  const words = query.split(/\s+/).filter(w => w.length > 3);
  let out = text;
  words.forEach(w => {
    const re = new RegExp(`(${w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
    out = out.replace(re, '<span class="highlight">$1</span>');
  });
  return out;
}

// Upload Logic
function triggerUpload(){ document.getElementById('file-input').click(); }

async function handleUpload(event){
  const file = event.target.files[0];
  if(!file) return;

  const zone = document.getElementById('upload-zone');
  const label = document.getElementById('upload-label');
  const icon = document.getElementById('upload-icon');

  zone.classList.add('uploading');
  icon.className = 'ti ti-loader';
  label.textContent = `parsing ${file.name}...`;

  const formData = new FormData();
  formData.append('file', file);
  // Default to empty array, or pass active tag filters to automatically tag new files
  formData.append('tags', JSON.stringify(Array.from(activeTags)));

  try {
    const res = await fetch(`${API_BASE}/ingest`, { method: 'POST', body: formData });
    if(res.ok){
      label.textContent = 'ingest complete!';
      icon.className = 'ti ti-check';
      await fetchDocuments();
    } else {
      label.textContent = 'upload failed';
      icon.className = 'ti ti-alert-triangle';
    }
  } catch(e) {
    label.textContent = 'network error';
    icon.className = 'ti ti-alert-triangle';
  }

  setTimeout(() => {
    zone.classList.remove('uploading');
    label.textContent = 'drop PDF or click to upload';
    icon.className = 'ti ti-upload';
    document.getElementById('file-input').value = '';
  }, 2500);
}

// Simple Markdown Parser
function renderMarkdown(md){
  return md
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`(.+?)`/g,'<code>$1</code>')
    .replace(/^---$/gm,'<hr style="border:none;border-top:0.5px solid var(--color-border-tertiary);margin:1.5rem 0">')
    .replace(/^\|(.+)\|$/gm,(match)=>{
      if(match.includes('---')) return '';
      const cells=match.slice(1,-1).split('|').map(c=>c.trim());
      return '<tr>'+cells.map(c=>`<td>${c}</td>`).join('')+'</tr>';
    })
    .replace(/(<tr>.*<\/tr>\n?)+/gs,m=>`<table>${m}</table>`)
    .split('\n').map(line=>line.match(/^<[h1-6thr]/)? line:(line.trim()?`<p>${line}</p>`:'')).join('\n');
}

function copyText(){
  const body = document.getElementById('reader-body');
  navigator.clipboard.writeText(body.innerText).catch(()=>{});
}

// Event Listeners
document.getElementById('doc-filter').addEventListener('input', e => renderDocs(e.target.value));
document.getElementById('query-input').addEventListener('keydown', e => { if(e.key === 'Enter') runSearch(); });

// Initialization
fetchDocuments();
</script>
