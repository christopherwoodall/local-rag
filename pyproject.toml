# =============================================================
# BUILD & PACKAGING
# =============================================================
[build-system]
requires = [
    "setuptools==81.0.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

# =============================================================
# PROJECT METADATA
# =============================================================
[project]
name = "local-rag"
version = "0.0.1"
description = "Local RAG API with Qdrant, Docling, and FastEmbed"
readme = "README.md"
requires-python = "==3.13"
dependencies = [
    "fastapi==0.136.1",
    "uvicorn==0.47.0",
    "qdrant-client==1.18.0",
    "fastembed==0.8.0",
    "docling==2.95.0",
    "python-multipart==0.0.29",
    "httpx==0.28.1",
    "motor==3.*",
    "trafilatura==2.*",
    "markdownify==0.14.*",
    "faster-whisper==1.*",
    "librosa==0.11.*",
    "numpy==2.4.6",
]

# =============================================================
# OPTIONAL DEPENDENCIES
# =============================================================
[project.optional-dependencies]
# Development & Testing
dev = [
    "ruff==0.15.12",
    "tomlkit==0.12.5",
    "hatch==1.16.5"
]

# =============================================================
# ENTRY POINTS
# =============================================================
[project.scripts]
# Start the RAG server
start-rag-server = "local_rag.main:start"

# Helpful utilities for development and debugging
docker-helper = "helpers.docker_helper:main"
update-deps = "helpers.update_deps:main"

# =============================================================
# UV CONFIGURATION
# =============================================================
[tool.uv]
exclude-newer = "7 days"

# =============================================================
# SETUPTOOLS CONFIGURATION
# =============================================================
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# =============================================================
# LINTING & FORMATTING (RUFF)
# =============================================================
[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (imports)
    "UP",   # pyupgrade (modern python syntax)
    "B",    # flake8-bugbear (prevents common bugs)
    "SIM",  # flake8-simplify
]
ignore = [
   "E501", # line-length violations
   "W293", # blank line contains whitespace
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
